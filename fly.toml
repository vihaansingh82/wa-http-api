# Fly.io deployment. Create the app and volume once, then `fly deploy` (or let
# the GitHub Action do it on every push to main).
#
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly volumes create sandesh_data --size 1 --region <your-region>
#   fly secrets set SUPABASE_URL=... SUPABASE_PUBLISHABLE_KEY=... \
#                   SUPABASE_SERVICE_ROLE_KEY=... PUBLIC_URL=https://<app>.fly.dev
#   fly deploy
#
# Change `app` to something unique before the first deploy.

app = "sandesh-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  # Must live on the mounted volume: this folder holds every client's WhatsApp
  # credentials, and losing it means they all re-scan.
  AUTH_DIR = "/data/auth"
  LOG_PRETTY = "false"
  SEND_DELAY_MS = "3000"
  # Sized for the 512 MB VM below, NOT the code default of 25. Each linked
  # client is a live WebSocket plus its own Signal store, so 25 of them on
  # 512 MB is an OOM loop -- and an OOM loop re-pairs every client repeatedly,
  # which is the one thing worth paying to avoid. Raise this and `memory`
  # together, roughly 1 GB per 10 tenants.
  MAX_TENANT_SESSIONS = "5"

[http_service]
  internal_port = 3000
  force_https = true
  # Never scale to zero and never run two of these. A suspended machine drops
  # the WhatsApp socket; a second machine sharing one session gets kicked off by
  # WhatsApp as a duplicate device.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "25s"
    method = "GET"
    path = "/health"

[mounts]
  source = "sandesh_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
