# Render Blueprint. In the dashboard: New > Blueprint, point it at this repo.
#
# Note the paid compute plan. It is not an upsell: Render only attaches a
# persistent disk to a paid instance, and a disk is mandatory here because the
# auth folder IS the WhatsApp session. On a free instance the service also
# sleeps when idle, which drops the WhatsApp socket. Either one forces you to
# re-scan the QR repeatedly, and repeated re-linking is a ban risk.

services:
  - type: web
    name: wa-http-api
    runtime: node
    # Cheapest paid plan (0.5 CPU / 512 MB). If you see the instance restarting
    # under memory pressure, move up to 1c-2g -- an OOM loop reconnects to
    # WhatsApp over and over, which is exactly what you want to avoid.
    plan: 0.5c-512mb
    region: singapore
    branch: main
    # Replaces the deprecated `autoDeploy: true`.
    autoDeployTrigger: commit
    # A disk cannot be shared, so Render pins this to one instance anyway --
    # which is also what WhatsApp requires: a second instance sharing the
    # session gets kicked off as a duplicate device.
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health

    disk:
      name: wa-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"
      # WhatsApp credentials must sit on the disk, or a redeploy loses every
      # client's session and they all have to re-scan.
      - key: AUTH_DIR
        value: /var/data/auth
      # Supabase holds accounts, contacts and messages. All three are required,
      # and all three are set in the dashboard rather than committed here --
      # sync:false means "prompt me, do not store it in git".
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # service_role key: bypasses row-level security, so it is a real secret.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Public origin, used for password-reset and confirmation redirects.
      - key: PUBLIC_URL
        sync: false
      - key: LOG_PRETTY
        value: "false"
      - key: SEND_DELAY_MS
        value: "3000"
      # Set these yourself if you want inbound messages forwarded.
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
